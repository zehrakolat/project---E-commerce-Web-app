<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="admin-header">

        <div class="admin-title">
            Admin Product Management
        </div>

        <div class="admin-nav">

            <button 
                id="orders-btn"
                onclick="window.location.href='admin-orders.html'">

                Orders

            </button>

        </div>

    </div>

    <h2 class="section-title">
        Add Product
    </h2>

    <form id="add-product-form">

        <input 
            type="text" 
            id="product-name" 
            placeholder="Product Name" 
            required
        >

        <input 
            type="number" 
            id="product-price" 
            placeholder="Price" 
            required
        >

        <input 
            type="number" 
            id="product-stock" 
            placeholder="Stock" 
            required
        >

        <button type="submit">
            Add Product
        </button>

    </form>

    <h2 class="section-title">
        Products
    </h2>

    <div 
        id="admin-product-list" 
        class="admin-grid">
    </div>

    <button 
        class="logout-btn" 
        onclick="logout()">

        Logout

    </button>

</div>

<script src="admin-products.js"></script>

</body>
</html>
